[project]
name = "pokelab-brain"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9", "httpx>=0.27", "structlog>=24.4", "websockets>=17.2", "numpy>=2.0", "pypdf>=5.0", "pokelab-labml", "pyyaml>=6.0", "arxiv>=2.1", "pandas>=2.2"]

[tool.uv.sources]
pokelab-labml = { path = "../labml" }

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pokelab_brain"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
