[project]
name = "pokelab-brain"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9", "httpx>=0.27", "structlog>=24.4", "websockets>=17.2", "numpy>=2.0"]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pokelab_brain"]
