[workspace]
resolver = "2"
members = [
    "crates/labd",
    "crates/lab-store",
    "crates/lab-gateway",
    "crates/lab-jobs",
    "crates/lab-metrics",
    "crates/lab-telemetry",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = "0.8.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1"
anyhow = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
time = { version = "0.3", features = ["serde"] }
