[project]
name = "pokelab-labml"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scikit-learn>=1.5", "scipy>=1.14", "pydantic>=2.9"]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pokelab_labml"]
