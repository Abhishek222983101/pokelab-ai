[project]
name = "pokelab-workers"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9", "numpy>=2.0", "torch>=2.14,<2.15", "wandb>=0.19"]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pokelab_workers"]
